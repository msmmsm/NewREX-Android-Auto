name: Android APK Build & Release

on:
  push:
    branches: [master]
    tags:
      - "v*"
    paths:
      - "app/**"
      - "gradle/**"
      - "gradlew"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Test Android APKs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Accept Android SDK Licenses
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run Unit Tests
        run: ./gradlew --no-daemon testFullDebugUnitTest testParkDebugUnitTest || true

      - name: Build Full & Park APKs
        run: ./gradlew --no-daemon assembleFullDebug assembleParkDebug

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: NewREX-Android-Auto-APKs
          path: |
            app/build/outputs/apk/full/debug/*.apk
            app/build/outputs/apk/park/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/build/outputs/apk/full/debug/*.apk
            app/build/outputs/apk/park/debug/*.apk
          generate_release_notes: true
