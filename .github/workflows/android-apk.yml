name: Android APK

on:
  push:
    branches: [master]
    paths:
      - "app/**"
      - "gradle/**"
      - "gradlew"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build debug APKs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Build full and park APKs
        run: ./gradlew --no-daemon assembleFullDebug assembleParkDebug

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: NewREX-AdBlock-APKs
          path: |
            app/build/outputs/apk/full/debug/*.apk
            app/build/outputs/apk/park/debug/*.apk
          if-no-files-found: error
          retention-days: 14
